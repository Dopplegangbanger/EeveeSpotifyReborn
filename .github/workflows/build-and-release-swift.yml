name: Build and Release Swift

on:
  workflow_dispatch:

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install Dependencies
        run: |
          set -euo pipefail
          brew update
          brew install make dpkg ldid wget jq xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Copy SwiftProtobuf (rootful)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/lib"
          mkdir swiftprotobuf && cd swiftprotobuf
          wget -q https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
          ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
          xz -d data.tar.lzma
          tar -xf data.tar
          cp -R Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib"

      - name: Copy SwiftProtobuf (rootless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/lib/iphone/rootless"
          mkdir swiftprotobuf-rootless && cd swiftprotobuf-rootless
          wget -q https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
          ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
          xz -d data.tar.lzma
          tar -xf data.tar
          cp -R var/jb/Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib/iphone/rootless"

      - name: Build EeveeSpotify (rootful)
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1
          echo "FILENAME_ROOTFUL=$(find packages -maxdepth 1 -type f -not -name '*debug*' -name '*.deb' -exec basename {} \; | head -n1)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME_ROOTFUL }}
          path: packages/${{ env.FILENAME_ROOTFUL }}
          if-no-files-found: error

      - name: Build EeveeSpotify (rootless)
